name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode information
        run: |
          xcodebuild -version
          xcodebuild -list -project SocksBypass.xcodeproj

      - name: Build iOS app
        run: |
          mkdir -p "$RUNNER_TEMP/build"

          xcodebuild \
            -project SocksBypass.xcodeproj \
            -scheme SocksBypass \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/build"

      - name: Package IPA
        run: |
          mkdir -p Payload

          cp -R \
            "$RUNNER_TEMP/build/SocksBypass.app" \
            Payload/SocksBypass.app

          zip -r SocksBypass-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SocksBypass-iOS
          path: SocksBypass-unsigned.ipa
