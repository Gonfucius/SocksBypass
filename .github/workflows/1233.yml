name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show project information
        run: |
          xcodebuild -version
          echo "========== PROJECT =========="
          xcodebuild -project SocksBypass.xcodeproj -list
